<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超高级！AI全功能动捕捏脸小人</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 5px; color: #4dadff; }
        .desc { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        
        .layout {
            display: flex;
            gap: 40px;
            background: #2a2a35;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            max-width: 1000px;
            width: 100%;
        }
        
        .preview-pane {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            background: #15151c;
            border-radius: 16px;
            padding: 20px;
        }
        
        #avatar-canvas {
            width: 360px;
            height: 360px;
            background: radial-gradient(#3a3a4a, #15151c);
            border-radius: 50%;
        }
        
        #webcam {
            width: 180px;
            height: 135px;
            border-radius: 12px;
            margin-top: 20px;
            transform: scaleX(-1);
            border: 2px solid #4dadff;
        }
        
        .ctrl-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .box {
            background: #323242;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e0e0e0;
        }
        
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #444454;
            color: white;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        
        select:focus { background: #555566; }
        
        button {
            background: #0088ff;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        button:hover { background: #0077ee; transform: scale(1.02); }
        
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            background: #ffb703;
            color: #222;
        }
    </style>
</head>
<body>

    <h1>Vibe Coding 高级动捕交互舱</h1>
    <div class="desc">支持独立双眼皮、双眉跳动、上下左右转头视差以及动态露牙嘴部系统</div>

    <div class="layout">
        <div class="preview-pane">
            <div id="status" class="badge">等待启动</div>
            
            <svg id="avatar-canvas" viewBox="0 0 400 400">
                <g id="head-master-group">
                    
                    <path id="hair-back" d="" fill="#2b2b2b" />
                    
                    <path d="M 175 280 L 175 340 L 225 340 L 225 280 Z" fill="#eac099" />
                    <path id="clothes" d="M 110 340 C 110 310, 290 310, 290 340 L 320 400 L 80 400 Z" fill="#e63946" />
                    
                    <ellipse id="face-base" cx="200" cy="200" rx="90" ry="100" fill="#fcd5b5" />
                    
                    <g id="face-features">
                        <path id="brow-L" d="M 130 160 Q 150 150 170 160" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" />
                        <path id="brow-R" d="M 230 160 Q 250 150 270 160" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" />
                        
                        <g id="eye-container-L" transform="translate(150, 190)">
                            <ellipse id="eye-L" cx="0" cy="0" rx="14" ry="14" fill="#222" />
                            <circle id="pupil-L" cx="-3" cy="-3" r="4" fill="#fff" />
                        </g>
                        
                        <g id="eye-container-R" transform="translate(250, 190)">
                            <ellipse id="eye-R" cx="0" cy="0" rx="14" ry="14" fill="#222" />
                            <circle id="pupil-R" cx="-3" cy="-3" r="4" fill="#fff" />
                        </g>
                        
                        <path id="nose" d="M 200 195 Q 190 220 200 225 Q 205 225 205 220" fill="none" stroke="#dcb08d" stroke-width="4" stroke-linecap="round" />
                        
                        <g transform="translate(200, 255)">
                            <path id="mouth-bg" d="M -30 0 Q 0 0 30 0 Q 0 0 -30 0 Z" fill="#781d22" />
                            <path id="mouth-teeth" d="M -25 1 L 25 1 L 22 8 L -22 8 Z" fill="#ffffff" opacity="0"/>
                            <path id="mouth-line" d="M -30 0 Q 0 0 30 0" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" />
                        </g>
                    </g>
                    
                    <path id="hair-front" d="" fill="#2b2b2b" />
                </g>
            </svg>

            <video id="webcam" autoplay playsinline></video>
        </div>

        <div class="ctrl-pane">
            <div class="box">
                <label>💇‍♂️ 个性化设计：选择发型</label>
                <select id="hair-style" onchange="changeHair(this.value)">
                    <option value="short">干练短发</option>
                    <option value="long">优雅长发</option>
                    <option value="anime">高燃动漫碎发</option>
                </select>
            </div>

            <div class="box">
                <label>🎨 个性化设计：基因色彩</label>
                <select id="hair-color" onchange="changeHairColor(this.value)" style="margin-bottom: 12px;">
                    <option value="#2b2b2b">玄色黑</option>
                    <option value="#a8dadc">未来科技银</option>
                    <option value="#e63946">极客烈焰红</option>
                </select>
                <select id="clothes-color" onchange="document.getElementById('clothes').setAttribute('fill', this.value)">
                    <option value="#e63946">学院风红</option>
                    <option value="#1d3557">极客深海蓝</option>
                    <option value="#4a4e69">复古高级灰</option>
                </select>
            </div>

            <div class="box">
                <label>🚀 体验 Vibe Coding</label>
                <button id="start-capture">请求摄像头并激活 AI 追踪</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // 1. 发型库数据定义（纯代码动态绘制高级 2D 形状）
        // =====================================================================
        const hairDatabase = {
            short: {
                front: "M 100 180 C 90 120, 120 70, 200 70 C 280 70, 310 120, 300 180 C 280 150, 240 140, 200 160 C 160 140, 120 150, 100 180 Z",
                back: "M 100 200 C 90 240, 310 240, 300 200 Z"
            },
            long: {
                front: "M 100 170 C 110 110, 140 80, 200 80 C 260 80, 290 110, 300 170 C 270 140, 230 140, 200 150 C 170 140, 130 140, 100 170 Z",
                back: "M 105 180 L 100 350 C 120 370, 150 350, 150 310 L 250 310 C 250 350, 280 370, 300 350 L 295 180 Z"
            },
            anime: {
                front: "M 95 170 L 120 120 L 140 140 L 170 100 L 190 140 L 210 140 L 230 100 L 260 140 L 280 120 L 305 170 C 280 150, 250 160, 200 165 C 150 160, 120 150, 95 170 Z",
                back: "M 95 180 L 80 260 L 120 230 L 280 230 L 320 260 L 305 180 Z"
            }
        };

        function changeHair(style) {
            document.getElementById('hair-front').setAttribute('d', hairDatabase[style].front);
            document.getElementById('hair-back').setAttribute('d', hairDatabase[style].back);
        }
        function changeHairColor(color) {
            document.getElementById('hair-front').setAttribute('fill', color);
            document.getElementById('hair-back').setAttribute('fill', color);
        }
        
        // 初始化短发样式
        changeHair('short');

        // =====================================================================
        // 2. 核心大模型解算与映射算法
        // =====================================================================
        const videoElement = document.getElementById('webcam');
        const startBtn = document.getElementById('start-capture');
        const statusTag = document.getElementById('status');

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, // 开启视网膜级虹膜与嘴唇边缘精细解算
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                statusTag.innerText = "未检测到面部";
                statusTag.style.background = "#555";
                return;
            }

            statusTag.innerText = "⚡ 实时同步中";
            statusTag.style.background = "#00b4d8";

            const landmarks = results.multiFaceLandmarks[0];

            // --- 算法核心：构建面部标定基准横截面 ---
            // 依据人脸最左边缘(234)和最右边缘(454)计算动态面部绝对宽度，用以消除前后距离带来的缩放误差
            const faceWidth = Math.hypot(landmarks[454].x - landmarks[234].x, landmarks[454].y - landmarks[234].y);

            // ==========================================
            // A. 左右转头(Yaw)与上下抬头(Pitch)视差控制
            // ==========================================
            const baseCenterX = (landmarks[234].x + landmarks[454].x) / 2;
            const baseCenterY = (landmarks[10].y + landmarks[152].y) / 2;

            // 计算偏移比例
            const yaw = (landmarks[4].x - baseCenterX) / faceWidth;     // 鼻尖偏离水平中心权重
            const pitch = (landmarks[4].y - baseCenterY) / faceWidth;   // 鼻尖偏离垂直中心权重

            // 映射到2D空间平移 (转头时五官移动幅度大于头部外廓，形成高级的立体视差)
            const headX = yaw * 40;
            const headY = pitch * 30;
            const featureX = yaw * 25;
            const featureY = pitch * 20;

            document.getElementById('head-master-group').setAttribute('transform', `translate(${headX}, ${headY})`);
            document.getElementById('face-features').setAttribute('transform', `translate(${featureX}, ${featureY})`);

            // ==========================================
            // B. 左右眼独立解算 (支持单眼眨眼/wink)
            // ==========================================
            // 左眼高度解算点: 159(上) 到 145(下)
            const leftEyeOpen = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y) / faceWidth;
            // 右眼高度解算点: 386(上) 到 374(下)
            const rightEyeOpen = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y) / faceWidth;

            // 动态系数映射：正常睁眼高度约14px，闭眼转换为极小的扁平椭圆
            let hL = Math.max(1, (leftEyeOpen - 0.03) * 110);
            let hR = Math.max(1, (rightEyeOpen - 0.03) * 110);
            if(hL > 15) hL = 14; if(hR > 15) hR = 14;

            document.getElementById('eye-L').setAttribute('ry', hL);
            document.getElementById('eye-R').setAttribute('ry', hR);

            // ==========================================
            // C. 左右独立眉毛跳动控制
            // ==========================================
            // 测量眉毛边缘到内眼角的相对垂直距离，防止眨眼误触眉毛动作
            const leftBrowHeight = Math.hypot(landmarks[70].x - landmarks[33].x, landmarks[70].y - landmarks[33].y) / faceWidth;
            const rightBrowHeight = Math.hypot(landmarks[300].x - landmarks[263].x, landmarks[300].y - landmarks[263].y) / faceWidth;

            // 计算跳动偏移像素值
            const moveL = (leftBrowHeight - 0.22) * 200;
            const moveR = (rightBrowHeight - 0.22) * 200;

            document.getElementById('brow-L').setAttribute('transform', `translate(0, ${-moveL})`);
            document.getElementById('brow-R').setAttribute('transform', `translate(0, ${-moveR})`);

            // ==========================================
            // D. 嘴部、悲伤下撇与露牙形态复合解算
            // ==========================================
            const mouthInsideH = Math.hypot(landmarks[13].x - landmarks[14].x, landmarks[13].y - landmarks[14].y) / faceWidth;
            const mouthCornerY_Avg = (landmarks[61].y + landmarks[291].y) / 2;
            const mouthCenterY_Avg = (landmarks[13].y + landmarks[14].y) / 2;

            // 情绪下撇计算值 (嘴角高度低于嘴唇中心时为正，代表难过下撇值)
            const sadFactor = (mouthCornerY_Avg - mouthCenterY_Avg) / faceWidth * 120;
            
            // 张嘴高度
            const openH = mouthInsideH * 220;

            // 构建复合贝塞尔三次曲线路径
            // 闭嘴时是一条平滑线，张嘴时嘴底向下深凹，嘴角根据难过/快乐因子上下起伏
            const lipPath = `M -30 ${sadFactor} Q 0 ${sadFactor + openH} 30 ${sadFactor}`;
            const bgPath = `M -30 ${sadFactor} Q 0 ${sadFactor + openH} 30 ${sadFactor} Q 0 ${sadFactor - openH*0.2} -30 ${sadFactor} Z`;
            
            document.getElementById('mouth-line').setAttribute('d', lipPath);
            document.getElementById('mouth-bg').setAttribute('d', bgPath);

            // 露牙检测算法：当张嘴高度达到一定阈值且嘴角向上或平滑时露牙，大张嘴或下撇时不露牙
            if (openH > 5 && sadFactor < 6) {
                // 牙齿可见，且跟随嘴角位置轻微位移
                document.getElementById('mouth-teeth').setAttribute('opacity', '1');
                document.getElementById('mouth-teeth').setAttribute('transform', `translate(0, ${sadFactor})`);
            } else {
                document.getElementById('mouth-teeth').setAttribute('opacity', '0');
            }
        });

        // 硬件总线连接：调用多媒体摄像头接口
        startBtn.addEventListener('click', async () => {
            statusTag.innerText = "下载AI大脑中...";
            try {
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await faceMesh.send({ image: videoElement });
                    },
                    width: 320,
                    height: 240
                });
                await camera.start();
                startBtn.style.display = 'none'; // 激活后隐藏控制按钮，界面更整洁
            } catch (err) {
                alert("摄像头接入受阻，请确保在 https 环境下运行或给与权限: " + err);
                statusTag.innerText = "硬件受阻";
            }
        });
    </script>
</body>
</html>
