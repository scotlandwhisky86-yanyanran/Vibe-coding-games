<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶奶的 Vibecoding 动捕捏脸小人</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 200px 20px 20px;
            margin: 0;
        }
        h1 { color: #333; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
        .main-container {
            display: flex;
            gap: 30px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }
        .canvas-area {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            border-radius: 12px;
            padding: 10px;
        }
        #avatar-view {
            width: 300px;
            height: 300px;
            background: #eef2f3;
            border-radius: 50%;
        }
        #webcam {
            width: 160px;
            height: 120px;
            border-radius: 8px;
            margin-top: 15px;
            transform: scaleX(-1); /* 镜像翻转，更自然 */
            border: 2px solid #ddd;
        }
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            cursor: pointer;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        .status-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #ffc107;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>动捕捏脸定制小人</h1>
    <div class="subtitle">让网页自动下载 AI 模型，用您的表情赋予 2D 小人生命！</div>

    <div class="main-container">
        <div class="canvas-area">
            <div id="status" class="status-tag">等待开启摄像头...</div>
            
            <svg id="avatar-view" viewBox="0 0 400 400">
                <path id="clothes" d="M 120 350 C 120 300, 280 300, 280 350 Z" fill="#ff5722" />
                <circle id="face" cx="200" cy="200" r="90" fill="#ffdbb5" stroke="#e0b388" stroke-width="2"/>
                <path id="hair" d="M 100 200 C 100 80, 300 80, 300 200 C 270 160, 130 160, 100 200 Z" fill="#2c3e50" />
                <ellipse id="eye-left" cx="165" cy="185" rx="12" ry="12" fill="#333" />
                <ellipse id="eye-right" cx="235" cy="185" rx="12" ry="12" fill="#333" />
                <path id="mouth" d="M 170 240 Q 200 240 230 240" fill="none" stroke="#e74c3c" stroke-width="5" stroke-linecap="round" />
            </svg>

            <video id="webcam" autoplay playsinline></video>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <label>💇‍♂️ 捏脸：头发颜色</label>
                <select id="hair-color-select" onchange="document.getElementById('hair').setAttribute('fill', this.value)">
                    <option value="#2c3e50">深海蓝黑</option>
                    <option value="#e67e22">活力橙黄</option>
                    <option value="#9b59b6">梦幻丁香紫</option>
                </select>
            </div>

            <div class="control-group">
                <label>👕 捏脸：衣服样式</label>
                <select id="clothes-color-select" onchange="document.getElementById('clothes').setAttribute('fill', this.value)">
                    <option value="#ff5722">落日橙</option>
                    <option value="#2ecc71">薄荷绿</option>
                    <option value="#3498db">晴空蓝</option>
                </select>
            </div>

            <div class="control-group">
                <label>📷 动态捕捉开关</label>
                <button id="start-btn">允许并开启表情同步</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const startBtn = document.getElementById('start-btn');
        const statusTag = document.getElementById('status');

        // 获取需要控制的 2D 娃娃器官元素
        const elEyeLeft = document.getElementById('eye-left');
        const elEyeRight = document.getElementById('eye-right');
        const elMouth = document.getElementById('mouth');

        // 实例化谷歌 FaceMesh 模型
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, // 精细化追踪眼睛和嘴唇边缘
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // 核心数据处理：当 AI 认出人脸后的动作
        faceMesh.onResults((results) => {
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                statusTag.innerText = "未检测到人脸";
                statusTag.style.background = "#6c757d";
                return;
            }
            
            statusTag.innerText = "🔮 动捕同步中...";
            statusTag.style.background = "#28a745";
            statusTag.style.color = "white";

            const landmarks = results.multiFaceLandmarks[0];

            // 算法：提取关键点的相对距离来计算眼睛和嘴巴的张开度
            // 左眼上下眼睑关键点：159 和 145
            const eyeLeftDist = Math.hypot(landmarks[159].x - landmarks[145].x, landmarks[159].y - landmarks[145].y);
            // 右眼上下眼睑关键点：386 和 374
            const eyeRightDist = Math.hypot(landmarks[386].x - landmarks[374].x, landmarks[386].y - landmarks[374].y);
            // 嘴唇内侧上下关键点：13 和 14
            const mouthDist = Math.hypot(landmarks[13].x - landmarks[14].x, landmarks[13].y - landmarks[14].y);

            // 映射：将真实人脸比例放大映射到 SVG 小人的高度属性上
            let leftEyeHeight = Math.max(2, eyeLeftDist * 500);
            let rightEyeHeight = Math.max(2, eyeRightDist * 500);
            let mouthHeight = mouthDist * 600;

            // 极限修正（防止变成怪异形状）
            if (leftEyeHeight < 4) leftEyeHeight = 2; // 模拟闭眼成一条缝
            if (rightEyeHeight < 4) rightEyeHeight = 2;

            // 实时更新 SVG 图案
            elEyeLeft.setAttribute('ry', leftEyeHeight);
            elEyeRight.setAttribute('ry', rightEyeHeight);

            // 动态绘制嘴巴弯曲度和张开度 (利用贝塞尔曲线 Q 命令控制控制点)
            // 当口开得很大时，改变控制点产生凹陷效果
            const mouthYOffset = 240 + mouthHeight;
            elMouth.setAttribute('d', `M 170 240 Q 200 ${mouthYOffset} 230 240`);
        });

        // 启动摄像头逻辑
        startBtn.addEventListener('click', async () => {
            statusTag.innerText = "正在下载 AI 模型...";
            try {
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await faceMesh.send({ image: videoElement });
                    },
                    width: 320,
                    height: 240
                });
                await camera.start();
                startBtn.style.display = 'none';
            } catch (err) {
                alert("无法获取摄像头权限或初始化失败: " + err);
                statusTag.innerText = "权限被拒绝";
            }
        });
    </script>
</body>
</html>
